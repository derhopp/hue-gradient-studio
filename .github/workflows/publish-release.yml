name: Publish Version Release

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]

permissions:
  contents: write

jobs:
  publish:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Publish new version if not released
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open("custom_components/hue_gradient_studio/manifest.json"))["version"])')"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            exit 0
          fi
          test -f "docs/RELEASE_NOTES_${VERSION}.md"
          gh release create "$VERSION" --target "$RELEASE_SHA" --title "Hue Gradient Studio $VERSION" --notes-file "docs/RELEASE_NOTES_${VERSION}.md"
